name: Build Windows VST3

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Locate VST3 bundle
        id: find-vst3
        shell: pwsh
        run: |
          $plugin = Get-ChildItem -Path build -Filter '*.vst3' -Directory -Recurse |
            Select-Object -First 1

          if (-not $plugin) {
            throw "No .vst3 bundle was produced under the build directory."
          }

          "plugin_path=$($plugin.FullName)" |
            Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: vst3-windows
          path: ${{ steps.find-vst3.outputs.plugin_path }}
          if-no-files-found: error
